  <meta property="og:description" content="Selected monochrome photographs by Arun R. Arunothayan.">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
    }

    body.dark {
      --bg: #111111;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --border: #333333;
    }

    body {
      font-family: "Abadi MT Condensed Light", "Abadi MT Condensed", Georgia, serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.7;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    h1 {
      margin: 0 0 0.2em 0;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.8;
    }

    .muted {
      color: var(--muted);
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 40px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      font: inherit;
      border-radius: 6px;
      font-size: 1em;
      line-height: 1;
    }

    .icon-button:hover {
      opacity: 0.8;
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 20px;
    }

    .hero-text {
      flex: 1;
      min-width: 0;
    }

    .hero-text p {
      margin: 0;
    }

    .hero-image img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .section-nav {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-top: 48px;
      margin-bottom: 16px;
    }

    .section-nav a {
      color: var(--muted);
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    .section-nav a.active {
      color: var(--text);
      border-color: var(--text);
    }

    .frames-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px 28px;
    }

    .frame {
      margin: 0;
    }

    .frame img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--border);
    }

    .frame figcaption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95em;
      line-height: 1.5;
    }

    .frame-title {
      color: var(--text);
    }

    .frame-meta {
      display: block;
      margin-top: 2px;
    }

    @media (max-width: 640px) {
      body {
        margin: 40px auto;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .hero-image img {
        width: 110px;
        height: 110px;
      }

      .frames-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e74a4517d935480f91db74b61c02c98f"}'></script>
</head>

<body>

  <div class="topbar">
    <div class="top-actions">
      <button class="icon-button" id="share-button" aria-label="Share this page" title="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <path d="M8.6 10.7 15.4 6.3"></path>
          <path d="M8.6 13.3 15.4 17.7"></path>
        </svg>
      </button>
      <button class="icon-button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1>Arun R. Arunothayan</h1>
      <p class="muted">
        Engineer working in product development across low-carbon concrete technology, advanced manufacturing, and automation. Here I write of work, and of the thoughts that gather around work.
      </p>
    </div>

    <div class="hero-image">
      <img src="/profile.jpg" alt="Portrait of Arun R. Arunothayan">
    </div>
  </div>

  <nav class="section-nav" aria-label="Content sections">
    <a href="/">Posts</a>
    <h2><a class="active" href="/frames/" aria-current="page">Frames</a></h2>
  </nav>

  <div class="frames-grid" id="frames-list" aria-live="polite"></div>

  <script>
    const button = document.getElementById('theme-toggle');
    const shareButton = document.getElementById('share-button');
    const framesList = document.getElementById('frames-list');
    const savedTheme = localStorage.getItem('theme');

    function setThemeButton(isDark) {
      button.innerHTML = isDark ? '&#9788;' : '&#9790;';
      button.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      button.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    }

    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }

    setThemeButton(document.body.classList.contains('dark'));

    button.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      setThemeButton(isDark);
    });

    async function copyShareUrl() {
      const originalLabel = shareButton.getAttribute('aria-label');
      const originalTitle = shareButton.title;

      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(window.location.href);
      } else {
        const input = document.createElement('textarea');
        input.value = window.location.href;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }

      shareButton.setAttribute('aria-label', 'Link copied');
      shareButton.title = 'Link copied';
      window.setTimeout(() => {
        shareButton.setAttribute('aria-label', originalLabel);
        shareButton.title = originalTitle;
      }, 1600);
    }

    shareButton.addEventListener('click', async () => {
      const description = document.querySelector('meta[name="description"]')?.content || '';
      const shareData = {
        title: document.querySelector('h2')?.textContent.trim() || document.title,
        text: description,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error.name === 'AbortError') {
            return;
          }
        }
      }

      copyShareUrl();
    });

    function formatDate(value) {
      if (!value) {
        return '';
      }

      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString('en-AU', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function renderFrame(frame) {
      const figure = document.createElement('figure');
      figure.className = 'frame';

      const image = document.createElement('img');
      image.src = frame.image;
      image.alt = frame.title;
      image.loading = 'lazy';
      image.decoding = 'async';
      figure.appendChild(image);

      const caption = document.createElement('figcaption');
      const title = document.createElement('span');
      title.className = 'frame-title';
      title.textContent = frame.title;
      caption.appendChild(title);

      const details = [
        formatDate(frame.date),
        frame.location,
        frame.camera
      ].filter(Boolean).join(' / ');

      if (details) {
        const meta = document.createElement('span');
        meta.className = 'frame-meta';
        meta.textContent = details;
        caption.appendChild(meta);
      }

      if (frame.caption) {
        const note = document.createElement('span');
        note.className = 'frame-meta';
        note.textContent = frame.caption;
        caption.appendChild(note);
      }

      figure.appendChild(caption);
      return figure;
    }

    async function loadFrames() {
      try {
        const response = await fetch('/data/frames.json', { cache: 'no-store' });
        const frames = await response.json();

        if (!frames.length) {
          framesList.innerHTML = '<p class="muted">No frames selected yet.</p>';
          return;
        }

        framesList.replaceChildren(...frames.map(renderFrame));
      } catch (error) {
        framesList.innerHTML = '<p class="muted">Frames could not be loaded.</p>';
      }
    }

    loadFrames();
  </script>

</body>
</html>
