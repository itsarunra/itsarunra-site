<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Posts | Arun R. Arunothayan</title>
  <meta name="description" content="Writing by Arun R. Arunothayan.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="itsarunra.com">
  <meta property="og:title" content="Posts | Arun R. Arunothayan">
  <meta property="og:description" content="Writing by Arun R. Arunothayan.">
  <meta property="og:url" content="https://itsarunra.com/posts/">
  <meta property="og:image" content="https://itsarunra.com/assets/og/arun-blog-card.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Social preview card for Arun R. Arunothayan's blog.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@ItsArunRA">
  <meta name="twitter:creator" content="@ItsArunRA">
  <meta name="twitter:title" content="Posts | Arun R. Arunothayan">
  <meta name="twitter:description" content="Writing by Arun R. Arunothayan.">
  <meta name="twitter:image" content="https://itsarunra.com/assets/og/arun-blog-card.png?v=2">
  <meta name="twitter:image:alt" content="Social preview card for Arun R. Arunothayan's blog.">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
    }

    body.dark {
      --bg: #111111;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --border: #333333;
    }

    body {
      font-family: "Abadi MT Condensed Light", "Abadi MT Condensed", Georgia, serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.7;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    h1 {
      margin: 0 0 0.2em 0;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    h2 {
      margin-top: 48px;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.8;
    }

    .muted {
      color: var(--muted);
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 40px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      font: inherit;
      border-radius: 6px;
      font-size: 1em;
      line-height: 1;
    }

    .icon-button:hover {
      opacity: 0.8;
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 20px;
    }

    .hero-text {
      flex: 1;
      min-width: 0;
    }

    .hero-text p {
      margin: 0;
    }

    .hero-image img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .post-item {
      margin-bottom: 20px;
    }

    .post-item time {
      display: inline-block;
      margin-top: 2px;
    }

    .section-nav {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-top: 48px;
      margin-bottom: 16px;
    }

    .section-nav h2 {
      margin: 0;
    }

    .section-nav a {
      color: var(--muted);
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    .section-nav a.active {
      color: var(--text);
      border-color: var(--text);
    }

    .posts-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 36px;
      align-items: start;
    }

    .archive-title {
      margin: 0 0 8px 0;
      font-size: 1rem;
      font-weight: normal;
      color: var(--muted);
    }

    .archive-list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.95em;
      line-height: 1.7;
    }

    .archive-list a {
      color: var(--muted);
      border-bottom: 1px solid transparent;
    }

    .archive-list a.active {
      color: var(--text);
      border-color: var(--text);
    }

    @media (max-width: 640px) {
      body {
        margin: 40px auto;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .hero-image img {
        width: 110px;
        height: 110px;
      }

      .posts-layout {
        grid-template-columns: 1fr;
        gap: 22px;
      }
    }
  </style>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e74a4517d935480f91db74b61c02c98f"}'></script>
</head>

<body>

  <div class="topbar">
    <div class="top-actions">
      <button class="icon-button" id="share-button" aria-label="Share this page" title="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <path d="M8.6 10.7 15.4 6.3"></path>
          <path d="M8.6 13.3 15.4 17.7"></path>
        </svg>
      </button>
      <button class="icon-button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1>Arun R. Arunothayan</h1>
      <p class="muted">
        Engineer working in product development across low-carbon concrete technology, advanced manufacturing, and automation. Here I write of work, and of the thoughts that gather around work.
      </p>
    </div>

    <div class="hero-image">
      <img src="/profile.jpg" alt="Portrait of Arun R. Arunothayan">
    </div>
  </div>

  <nav class="section-nav" aria-label="Content sections">
    <h2><a class="active" href="/posts/" aria-current="page">Posts</a></h2>
    <a href="/frames/">Frames</a>
  </nav>

  <div class="posts-layout">
    <div id="posts-list" aria-live="polite"></div>
    <aside aria-label="Post archive">
      <h3 class="archive-title">Archive</h3>
      <ul class="archive-list" id="posts-archive"></ul>
    </aside>
  </div>

  <script>
    const button = document.getElementById('theme-toggle');
    const shareButton = document.getElementById('share-button');
    const savedTheme = localStorage.getItem('theme');

    function setThemeButton(isDark) {
      button.innerHTML = isDark ? '&#9788;' : '&#9790;';
      button.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      button.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    }

    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }

    setThemeButton(document.body.classList.contains('dark'));

    button.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      setThemeButton(isDark);
    });

    async function copyShareUrl() {
      const originalLabel = shareButton.getAttribute('aria-label');
      const originalTitle = shareButton.title;

      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(window.location.href);
      } else {
        const input = document.createElement('textarea');
        input.value = window.location.href;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }

      shareButton.setAttribute('aria-label', 'Link copied');
      shareButton.title = 'Link copied';
      window.setTimeout(() => {
        shareButton.setAttribute('aria-label', originalLabel);
        shareButton.title = originalTitle;
      }, 1600);
    }

    shareButton.addEventListener('click', async () => {
      const description = document.querySelector('meta[name="description"]')?.content || '';
      const shareData = {
        title: document.querySelector('h1')?.textContent.trim() || document.title,
        text: description,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error.name === 'AbortError') {
            return;
          }
        }
      }

      copyShareUrl();
    });
  </script>
  <script>
    window.POSTS_ARCHIVE_BASE_PATH = '/posts/';
  </script>
  <script src="/assets/posts-archive.js"></script>

</body>
</html>
